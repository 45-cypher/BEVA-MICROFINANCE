<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEVA MICROFINANCE LIMITED | Production</title>
<style>
:root{--ink:#18312d;--brand:#1f5b54;--bg:#f4f7f6;--card:#fff;--line:#dce6e2;--muted:#667570;--gold:#b98528;--red:#b53a2d;--redbg:#fae1dd;--green:#367753;--greenbg:#dff0e5;--warn:#8a641d;--warnbg:#fff1ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:flex}.side{width:245px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:18px;z-index:5}.brand{display:flex;gap:10px;align-items:center;margin-bottom:25px}.logo{width:40px;height:40px;background:var(--ink);color:#e8c876;border-radius:10px;display:grid;place-items:center;font-weight:800}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);margin-top:3px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);cursor:pointer;margin:2px 0}.nav button.active{background:var(--ink);color:#fff}.sidefoot{position:absolute;bottom:16px;left:18px;right:18px;color:var(--muted);font-size:10px;line-height:1.5}.main{margin-left:245px;width:calc(100% - 245px);padding:26px;max-width:1700px}h1{margin:0 0 4px;font-size:25px}h2{font-size:18px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:var(--ink);color:#fff}.brandbtn{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:var(--red);color:#fff}.mini{padding:5px 8px;font-size:11px}.search{padding:9px 11px;border:1px solid var(--line);border-radius:8px;min-width:220px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:17px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:20px;margin-top:7px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.badge{padding:4px 8px;border-radius:999px;font-size:10px;display:inline-block}.active{background:#dcece8;color:var(--brand)}.paid{background:var(--greenbg);color:var(--green)}.late{background:var(--redbg);color:var(--red)}.pending{background:var(--warnbg);color:var(--warn)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.modal{position:fixed;inset:0;background:#18312d70;display:grid;place-items:center;padding:18px;z-index:30}.box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:20px}.close{float:right;border:0;background:transparent;font-size:22px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:11px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.field textarea{min-height:70px}.notice{background:var(--warnbg);color:var(--warn);padding:10px;border-radius:8px;font-size:11px;margin-bottom:12px}.schedule{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.day{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}.progress{height:7px;background:#e9efed;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand)}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:60}.kpi{display:flex;justify-content:space-between;gap:10px}.small{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:6px;margin-bottom:13px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
@media(max-width:800px){.side{width:64px;padding:8px}.brand div:not(.logo),.brand b,.brand small,.nav span,.sidefoot{display:none}.main{margin-left:64px;width:calc(100% - 64px);padding:16px}.fields{grid-template-columns:1fr}.search{width:100%}}
.readonly{background:#f5f7f6!important;color:#5f6e69}.rolepill{font-size:10px;padding:4px 8px;border-radius:99px;background:#edf3f1;color:var(--brand)}.historybox{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fbfcfc}</style>
</head>
<body>
<div class="app"><aside class="side"><div><div class="brand"><div class="logo">BE</div><div><b>BEVA MICROFINANCE</b><small>Production Management System</small></div></div><nav id="nav"></nav></div><div class="sidefoot">Your Bridge to Financial Growth<br>Secure server authentication · Role based controls</div></aside><main id="root" class="main">Inapakia...</main></div>
<div id="modal"></div><div id="toast" class="toast"></div>
<script>
const API="/.netlify/functions/api";
const KEY="beva_production_session";
let db={users:[],clients:[],centres:[],circles:[],loans:[],repayments:[],approvals:[],audit:[],cashbook:[],settings:{company:"BEVA MICROFINANCE LIMITED",tagline:"Your Bridge to Financial Growth"}};
let session=null,page="dashboard",q="",tab="all";

const money=n=>"TZS "+Math.round(Number(n)||0).toLocaleString("en-US"), today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"-";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function normalize(){for(const k of ["users","clients","circles","loans","repayments","approvals","audit","cashbook"])db[k] ||= [];db.settings ||= {}}
async function load(){if(!session){showLogin();return}try{db=await apiCall("GET","/data");normalize();render()}catch(e){if(e.message!=="UNAUTHORIZED")alert("Imeshindikana kupakia data: "+e.message)}}
async function save(){try{await apiCall("PUT","/data",db);toast("Imehifadhiwa kwenye server")}catch(e){toast("Server haijahifadhi data: "+e.message)}}
async function apiCall(method,path,body){const token=sessionStorage.getItem("beva_prod_token")||"";const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});let d={};try{d=await r.json()}catch(_){}if(r.status===401){session=null;sessionStorage.removeItem("beva_prod_token");sessionStorage.removeItem("beva_prod_session");showLogin();throw new Error("UNAUTHORIZED")}if(!r.ok)throw new Error(d.error||"Server error");return d}
function log(action,entity,id,details=""){db.audit.push({id:uid(),at:new Date().toISOString(),user:session?.name||"System",role:session?.role||"",action,entity,entityId:id,details})}
function role(){let r=session?.role||"viewer";return r==="officer"?"loan_officer":r} function can(...rs){return rs.includes(role())}
function nav(){let items=[["dashboard","⌂","Dashboard",true],["centres","⌖","Centres",can("admin","manager")],["clients","👥","Wateja",true],["circles","◉","Circles",true],["loans","▣","Mikopo",true],["daily","▤","Daily Collection",true],["approvals","✓","Approvals",can("admin","manager")],["cashbook","▤","Cashbook",can("admin","manager","cashier")],["reports","▥","Ripoti",true],["users","♙","Users",can("admin")],["audit","◌","Audit Trail",can("admin","manager")],["settings","⚙","Settings",can("admin")]];
document.getElementById("nav").innerHTML=items.filter(x=>x[3]).map(x=>`<button class="${page===x[0]?"active":""}" onclick="go('${x[0]}')"><b>${x[1]}</b> <span>${x[2]}</span></button>`).join("")}
function go(p){page=p;q="";render()}
function stat(l,v){return `<div class="stat"><label>${l}</label><strong>${v}</strong></div>`}
function header(t,s,a=""){return `<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="actions">${a}</div></div>`}
function badge(s){return `<span class="badge ${s==="Imelipwa"?"paid":s==="Imechelewa"?"late":s==="Pending"?"pending":"active"}">${s}</span>`}
function client(id){return db.clients.find(x=>x.id===id)} function circle(id){return db.circles.find(x=>x.id===id)} function user(id){return db.users.find(x=>x.id===id)}
function calc(l){let interest=l.interestType==="reducing"?(+l.principal||0)*(+l.interestRate||0)/100*(+l.termMonths||0)/12:(+l.principal||0)*(+l.interestRate||0)/100;let total=Math.round(+l.principal+interest),rep=db.repayments.filter(r=>r.loanId===l.id).reduce((s,r)=>s+(+r.amount||0),0),out=Math.max(total-rep,0),due=l.dueDate||addDays(l.disbursementDate,l.termDays||30);return {...l,interest,total,repaid:rep,outstanding:out,dueDate:due,status:out<=0?"Imelipwa":today()>due?"Imechelewa":"Hai"}}
function addDays(d,n){let x=new Date(d+"T00:00:00");x.setDate(x.getDate()+Number(n));return x.toISOString().slice(0,10)}
function loans(){return db.loans.map(calc)}
function schedule(l){let days=+l.termDays||30,daily=Math.ceil(l.total/days),a=[];for(let i=1;i<=days;i++){let d=addDays(l.disbursementDate,i),due=Math.min(daily,l.total-(i-1)*daily),paid=db.repayments.filter(r=>r.loanId===l.id&&r.date===d).reduce((s,r)=>s+(+r.amount||0),0);a.push({i,d,due,paid})}return a}
function showLogin(){document.getElementById("root").innerHTML=`<div style="max-width:440px;margin:12vh auto"><div class="panel"><div class="brand"><div class="logo">BE</div><div><b>BEVA MICROFINANCE LIMITED</b><small>Production Management System</small></div></div><h1>Sign in</h1><p class="sub">Server-managed accounts.</p><div class="notice">Kwa production, badilisha demo credentials na tumia authentication ya server.</div><div class="field"><label>Username</label><input id="login-user" value="admin"></div><div class="field"><label>Password</label><input id="login-pass" type="password" value="admin123"></div><button class="btn primary" style="width:100%" onclick="login()">Sign in</button></div></div>`}
async function login(){let u=document.getElementById("login-user").value.trim(),p=document.getElementById("login-pass").value;try{sessionStorage.removeItem("beva_prod_token");sessionStorage.removeItem("beva_prod_session");let r=await apiCall("POST","/login",{username:u,password:p});session=r.user;sessionStorage.setItem("beva_prod_token",r.token);sessionStorage.setItem("beva_prod_session",JSON.stringify(r.user));db={users:[],clients:[],centres:[],circles:[],loans:[],repayments:[],approvals:[],audit:[],cashbook:[],settings:{}};await load()}catch(e){if(e.message!=="UNAUTHORIZED")alert(e.message||"Login imeshindikana")}}
function logout(){session=null;sessionStorage.removeItem("beva_prod_token");sessionStorage.removeItem("beva_prod_session");showLogin()}
function render(){nav();document.getElementById("root").innerHTML=({dashboard:dash,centres:centresPage,clients:clientsPage,circles:circlesPage,loans:loansPage,daily:dailyPage,approvals:approvalsPage,cashbook:cashbookPage,reports:reportsPage,users:usersPage,audit:auditPage,settings:settingsPage}[page])()}
function dash(){let ls=loans(),dis=ls.reduce((s,l)=>s+l.principal,0),rep=ls.reduce((s,l)=>s+l.repaid,0),out=ls.reduce((s,l)=>s+l.outstanding,0),due=ls.reduce((s,l)=>s+dueToday(l),0),paid=ls.reduce((s,l)=>s+paidToday(l),0),pending=db.approvals.filter(x=>x.status==="Pending").length;return header("Dashboard","BEVA portfolio overview",`<button class="btn ghost" onclick="load()">↻ Refresh</button><button class="btn ghost" onclick="logout()">Logout</button>`)
+`<div class="stats">${stat("Wateja",db.clients.length)}${stat("Circles",db.circles.length)}${stat("Active Loans",ls.filter(x=>x.status==="Hai").length)}${stat("Overdue",ls.filter(x=>x.status==="Imechelewa").length)}${stat("Disbursed",money(dis))}${stat("Repaid",money(rep))}${stat("Outstanding",money(out))}${stat("Today's Collection",money(paid))}</div>
+<div class="grid2"><div class="panel"><h2>Collection ya Leo</h2><p class="sub">Expected ${money(due)} · Collected ${money(paid)}</p><div class="progress"><i style="width:${due?Math.min(100,paid/due*100):0}%"></i></div><p class="small">${due?Math.round(paid/due*100):0}% collection</p></div><div class="panel"><h2>Control Center</h2><p class="sub">Pending approvals: <b>${pending}</b> · User: <b>${esc(session.name)}</b> (${session.role})</p><div class="actions"><button class="btn primary" onclick="openClient()">+ Customer</button><button class="btn brandbtn" onclick="openLoan()">+ Loan</button><button class="btn brandbtn" onclick="openPayment()">+ Payment</button></div></div></div>
+<div class="panel" style="margin-top:13px"><h2>Overdue Loans</h2>${tableLoans(ls.filter(x=>x.status==="Imechelewa").slice(0,10))||'<div class="empty">Hakuna overdue.</div>'}</div>`}
function tableLoans(a){if(!a.length)return "";return `<div class="tablewrap"><table class="table"><thead><tr><th>Loan No</th><th>Customer</th><th>Circle</th><th>Principal</th><th>Due</th><th>Outstanding</th><th>Status</th><th></th></tr></thead><tbody>${a.map(l=>`<tr><td>${esc(l.loanNo)}</td><td>${esc(client(l.clientId)?.name||"-")}</td><td>${esc(circle(l.circleId)?.name||"-")}</td><td>${money(l.principal)}</td><td>${fmt(l.dueDate)}</td><td>${money(l.outstanding)}</td><td>${badge(l.status)}</td><td><button class="btn ghost mini" onclick="loanDetail('${l.id}')">View</button></td></tr>`).join("")}</tbody></table></div>`}
function circlesPage(){return header("Circles / Centers","Groups and field officers",`<button class="btn primary" onclick="openCircle()">+ Circle</button><button class="btn ghost" onclick="openOfficer()">+ Officer</button>`)+`<div class="grid2">${db.circles.map(c=>{let m=db.clients.filter(x=>x.circleId===c.id).length,ls=loans().filter(x=>x.circleId===c.id);return `<div class="panel"><div class="kpi"><h2>${esc(c.name)}</h2><span>${m} members</span></div><p class="sub">Officer: ${esc(user(c.officerId)?.name||"-")}</p>${stat("Outstanding",money(ls.reduce((s,l)=>s+l.outstanding,0)))}<button class="btn ghost mini" onclick="openCircle('${c.id}')">Edit</button></div>`}).join("")||'<div class="empty">Hakuna circles.</div>'}</div>`}
function loansPage(){let a=loans().filter(l=>((client(l.clientId)?.name||"")+" "+l.loanNo).toLowerCase().includes(q.toLowerCase()));return header("Mikopo","Loan register & controls",`<input class="search" placeholder="Tafuta loan/customer..." value="${esc(q)}" oninput="q=this.value;render()"><button class="btn primary" onclick="openLoan()">+ Mkopo</button>`)+`<div class="panel">${tableLoans(a)||'<div class="empty">Hakuna mikopo.</div>'}</div>`}
function loanDetail(id){let l=loans().find(x=>x.id===id);if(!l)return;document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${esc(client(l.clientId)?.name||"")}</h2><p class="sub">${esc(l.loanNo)} · ${badge(l.status)} · Created by ${esc(l.createdByName||"-")}</p><div class="stats">${stat("Principal",money(l.principal))}${stat("Total Due",money(l.total))}${stat("Repaid",money(l.repaid))}${stat("Outstanding",money(l.outstanding))}</div><div class="actions"><button class="btn brandbtn" onclick="closeModal();openPayment('${l.id}')">+ Payment</button><button class="btn primary" onclick="closeModal();openPayment('${l.id}','Prepayment')">Prepayment</button>${can("admin","manager")?`<button class="btn danger" onclick="voidLoan('${l.id}')">Void</button>`:""}</div><h2 style="margin-top:20px">Daily Schedule</h2>${scheduleHtml(l)}<h2 style="margin-top:20px">Repayments</h2>${repTable(l)}</div></div>`}
function scheduleHtml(l){return `<div class="schedule">${schedule(l).map(x=>`<div class="day"><b>Day ${x.i}</b> · ${fmt(x.d)}<br><span class="small">Due ${money(x.due)} · Paid ${money(x.paid)}</span><br>${x.paid>=x.due?badge("Imelipwa"):x.d<today()?badge("Imechelewa"):badge("Pending")}</div>`).join("")}</div>`}
function repTable(l){let a=db.repayments.filter(r=>r.loanId===l.id).reverse();return a.length?`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Amount</th><th>Ref</th><th>By</th></tr>${a.map(r=>`<tr><td>${fmt(r.date)}</td><td>${esc(r.type)}</td><td>${money(r.amount)}</td><td>${esc(r.ref||"-")}</td><td>${esc(r.userName||"-")}</td></tr>`).join("")}</table></div>`:'<div class="empty">Hakuna malipo.</div>'}
function dailyPage(){let rows=[];loans().filter(l=>l.status!=="Imelipwa").forEach(l=>{let x=schedule(l).find(s=>s.d===today());if(x)rows.push({l,x})});let exp=rows.reduce((s,r)=>s+r.x.due,0),col=rows.reduce((s,r)=>s+r.x.paid,0);return header("Daily Collection","Collection sheet ya leo",`<button class="btn brandbtn" onclick="openPayment()">+ Payment</button><button class="btn ghost" onclick="print()">Print Sheet</button>`)+`<div class="stats">${stat("Expected",money(exp))}${stat("Collected",money(col))}${stat("Customers Due",rows.length)}${stat("Arrears",rows.filter(r=>r.x.paid<r.x.due).length)}</div><div class="panel">${rows.length?`<div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Circle</th><th>Expected</th><th>Paid</th><th>Balance</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(client(r.l.clientId)?.name||"-")}</td><td>${esc(circle(r.l.circleId)?.name||"-")}</td><td>${money(r.x.due)}</td><td>${money(r.x.paid)}</td><td>${money(Math.max(r.x.due-r.x.paid,0))}</td><td><button class="btn brandbtn mini" onclick="openPayment('${r.l.id}')">Collect</button></td></tr>`).join("")}</table></div>`:'<div class="empty">Hakuna payments zinazodaiwa leo.</div>'}</div>`}
function approvalsPage(){let a=db.approvals.filter(x=>tab==="all"||x.status===tab);return header("Approvals","Maker-checker workflow",`<div class="tabs"><button class="${tab==='all'?'on':''}" onclick="tab='all';render()">All</button><button class="${tab==='Pending'?'on':''}" onclick="tab='Pending';render()">Pending</button><button class="${tab==='Approved'?'on':''}" onclick="tab='Approved';render()">Approved</button><button class="${tab==='Rejected'?'on':''}" onclick="tab='Rejected';render()">Rejected</button></div>`)+`<div class="panel"><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Ref</th><th>Requested By</th><th>Date</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.ref)}</td><td>${esc(x.requestedByName)}</td><td>${fmt(x.date)}</td><td>${badge(x.status)}</td><td>${x.status==="Pending"&&can("admin","manager")&&x.requestedBy!==session.id?`<button class="btn brandbtn mini" onclick="decide('${x.id}','Approved')">Approve</button> <button class="btn danger mini" onclick="decide('${x.id}','Rejected')">Reject</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6">Hakuna approvals.</td></tr>'}</table></div></div>`}
function cashbookPage(){let a=db.cashbook.slice().reverse();let bal=db.cashbook.reduce((s,x)=>s+(x.type==="IN"?x.amount:-x.amount),0);return header("Cashbook","Daily cash movements & reconciliation",`<button class="btn primary" onclick="openCash()">+ Transaction</button>`)+`<div class="stats">${stat("Cash Balance",money(bal))}${stat("Transactions",a.length)}</div><div class="panel"><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Ref</th><th>By</th></tr>${a.map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.type}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.ref||"-")}</td><td>${esc(x.userName)}</td></tr>`).join("")}</table></div></div>`}
function reportsPage(){let ls=loans(),dis=ls.reduce((s,l)=>s+l.principal,0),rep=ls.reduce((s,l)=>s+l.repaid,0),par=ls.filter(l=>l.status==="Imechelewa").reduce((s,l)=>s+l.outstanding,0);return header("Ripoti","Portfolio, PAR, collection & audit",`<button class="btn ghost" onclick="exportData()">Backup JSON</button><button class="btn ghost" onclick="print()">Print</button>`)+`<div class="stats">${stat("Disbursed",money(dis))}${stat("Repaid",money(rep))}${stat("Outstanding",money(dis-rep))}${stat("PAR Amount",money(par))}${stat("PAR Loans",ls.filter(l=>l.status==="Imechelewa").length)}${stat("Collection Today",money(ls.reduce((s,l)=>s+paidToday(l),0)))} </div><div class="grid2"><div class="panel"><h2>Circle Performance</h2><table class="table"><tr><th>Circle</th><th>Loans</th><th>Disbursed</th><th>Outstanding</th></tr>${db.circles.map(c=>{let x=ls.filter(l=>l.circleId===c.id);return `<tr><td>${esc(c.name)}</td><td>${x.length}</td><td>${money(x.reduce((s,l)=>s+l.principal,0))}</td><td>${money(x.reduce((s,l)=>s+l.outstanding,0))}</td></tr>`}).join("")}</table></div><div class="panel"><h2>Staff Activity</h2>${db.users.map(u=>`<p>${esc(u.name)} — ${esc(u.role)} · ${db.audit.filter(a=>a.user===u.name).length} audit events</p>`).join("")}</div></div>`}
function usersPage(){return header("Users & Roles","Admin, Manager, Loan Officer, Cashier",`<button class="btn primary" onclick="openUser()">+ User</button>`)+`<div class="panel"><table class="table"><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active===false?"Inactive":"Active"}</td><td><button class="btn ghost mini" onclick="openUser('${u.id}')">Edit</button></td></tr>`).join("")}</table></div>`}
function auditPage(){let a=db.audit.slice().reverse();return header("Audit Trail","System activity log",`<button class="btn ghost" onclick="exportData()">Export</button>`)+`<div class="panel"><table class="table"><tr><th>Date/Time</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Details</th></tr>${a.map(x=>`<tr><td>${new Date(x.at).toLocaleString("en-GB")}</td><td>${esc(x.user)}</td><td>${esc(x.role)}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.details)}</td></tr>`).join("")}</table></div>`}
function settingsPage(){return header("Settings","Company & data controls",`<button class="btn primary" onclick="saveSettings()">Save</button>`)+`<div class="grid2"><div class="panel"><h2>Company</h2><div class="field"><label>Company</label><input id="sc" value="${esc(db.settings.company)}"></div><div class="field"><label>Tagline</label><input id="st" value="${esc(db.settings.tagline)}"></div></div><div class="panel"><h2>Backup</h2><p class="sub">Download backup kabla ya changes kubwa.</p><button class="btn ghost" onclick="exportData()">Download JSON</button><input type="file" accept=".json" onchange="restoreData(this)" style="margin-top:12px"></div></div>`}
function centre(id){return db.centres.find(x=>x.id===id)} function centreName(id){return centre(id)?.name||"-"} function nextLoanCycle(cid){return db.loans.filter(x=>x.clientId===cid&&!["Voided","Rejected"].includes(x.status)).length+1} function clientLoans(cid){return loans().filter(x=>x.clientId===cid).sort((a,b)=>(a.loanCycle||0)-(b.loanCycle||0))} function cycleBadge(n){return `<span class="badge active">Cycle ${n||1}</span>`} function filteredCircles(cid){return db.circles.filter(c=>!cid||c.centreId===cid)} function centreSelect(id,val=""){return `<select id="${id}"><option value="">-- Select Centre --</option>${db.centres.map(c=>`<option value="${c.id}" ${val===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`}
function centresPage(){if(!can("admin","manager"))return `<div class="empty">Huna ruhusa.</div>`;return header("Centres","Maeneo ya uendeshaji",`<button class="btn primary" onclick="openCentre()">+ Centre</button>`)+`<div class="grid2">${db.centres.map(c=>{let cs=db.clients.filter(x=>x.centreId===c.id).length,ls=loans().filter(x=>x.centreId===c.id);return `<div class="panel"><div class="kpi"><h2>${esc(c.name)}</h2><span>${cs} customers</span></div><p class="sub">${esc(c.location||"")}</p>${stat("Customers",cs)} ${stat("Loans",ls.length)} ${stat("Outstanding",money(ls.reduce((s,l)=>s+l.outstanding,0)))}<br><button class="btn ghost mini" onclick="openCentre('${c.id}')">Edit</button> ${can("admin")?`<button class="btn danger mini" onclick="deleteCentre('${c.id}')">Delete</button>`:""}</div>`}).join("")||'<div class="empty">Hakuna Centre bado.</div>'}</div>`}
function officerOptions(sel=""){return db.users.filter(u=>u.active!==false).map(u=>`<option value="${u.id}" ${sel===u.id?"selected":""}>${esc(u.name)} (${esc(u.role)})</option>`).join("")}
function openCircle(id=null){if(!can("admin","manager"))return alert("Huna ruhusa.");let c=id?circle(id):{};document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${id?"Edit Circle":"New Circle"}</h2><div class="field"><label>Circle Name *</label><input id="cirname" value="${esc(c.name||"")}"></div><div class="field"><label>Centre *</label>${centreSelect("circentre",c.centreId||"")}</div><div class="field"><label>Field Officer</label><select id="cirofficer"><option value="">-- None --</option>${officerOptions(c.officerId||"")}</select></div><div class="actions"><button class="btn primary" onclick="saveCircleForm('${id||""}')">Hifadhi</button>${id&&can("admin")?`<button class="btn danger" onclick="deleteCircle('${id}')">Futa</button>`:""}</div></div></div>`}
function saveCircleForm(id){let c={id:id||uid(),name:cirname.value.trim(),centreId:circentre.value,officerId:cirofficer.value||""};if(!c.name||!c.centreId)return alert("Weka jina la Circle na Centre");if(id)db.circles=db.circles.map(x=>x.id===id?c:x);else db.circles.push(c);log(id?"UPDATE":"CREATE","circle",c.id,c.name);save();closeModal();render()}
function deleteCircle(id){if(!can("admin"))return alert("Admin pekee.");if(db.clients.some(x=>x.circleId===id)||db.loans.some(x=>x.circleId===id))return alert("Circle ina records zilizounganishwa.");if(confirm("Futa Circle?")){db.circles=db.circles.filter(x=>x.id!==id);log("DELETE","circle",id);save();closeModal();render()}}
function openOfficer(){openUser(null,"loan_officer")}
function openUser(id=null,presetRole=null){if(!can("admin"))return alert("Admin pekee.");let u=id?user(id):{},role=u.role||presetRole||"loan_officer";const opt=(v,label)=>`<option value="${v}" ${role===v?"selected":""}>${label}</option>`;document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${id?"Edit User":"New User"}</h2><div class="fields"><div class="field"><label>Full Name *</label><input id="un" value="${esc(u.name||"")}"></div><div class="field"><label>Username *</label><input id="uu" value="${esc(u.username||"")}"></div><div class="field"><label>Role *</label><select id="ur">${opt("admin","Admin")}${opt("manager","Manager")}${opt("loan_officer","Loan Officer")}${opt("cashier","Cashier")}${opt("viewer","Viewer")}</select></div><div class="field"><label>Status</label><select id="ua"><option value="1" ${u.active!==false?"selected":""}>Active</option><option value="0" ${u.active===false?"selected":""}>Inactive</option></select></div><div class="field full"><label>${id?"New Password (acha wazi kama hutaki kubadilisha)":"Password *"}</label><input id="up" type="password" placeholder="${id?"••••••••":"Angalau characters 8"}"></div></div><button class="btn primary" onclick="saveUserForm('${id||""}')">Hifadhi</button></div></div>`}
async function saveUserForm(id){let b={name:un.value.trim(),username:uu.value.trim(),role:ur.value,active:ua.value==="1"};if(id)b.id=id;if(!b.name||!b.username)return alert("Jaza jina na username");if(up.value)b.password=up.value;try{await apiCall("POST","/users",b);toast("Imehifadhiwa");closeModal();await load()}catch(e){alert(e.message||"Imeshindikana kuhifadhi user")}}
function openCentre(id=null){if(!can("admin","manager"))return alert("Huna ruhusa.");let c=id?centre(id):{};document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${id?"Edit Centre":"New Centre"}</h2><div class="field"><label>Centre Name *</label><input id="cenname" value="${esc(c.name||"")}"></div><div class="field"><label>Location</label><input id="cenloc" value="${esc(c.location||"")}"></div><button class="btn primary" onclick="saveCentre('${id||""}')">Hifadhi</button></div></div>`}
function saveCentre(id){let c={id:id||uid(),name:cenname.value.trim(),location:cenloc.value.trim()};if(!c.name)return alert("Weka jina");if(id)db.centres=db.centres.map(x=>x.id===id?c:x);else db.centres.push(c);log(id?"UPDATE":"CREATE","centre",c.id,c.name);save();closeModal();render()}
function deleteCentre(id){if(!can("admin"))return alert("Admin pekee.");if(db.clients.some(x=>x.centreId===id)||db.circles.some(x=>x.centreId===id)||db.loans.some(x=>x.centreId===id))return alert("Centre ina records zilizounganishwa.");if(confirm("Futa Centre?")){db.centres=db.centres.filter(x=>x.id!==id);log("DELETE","centre",id);save();render()}}
function openClient(id=null){if(!can("admin","manager","loan_officer"))return alert("Huna ruhusa.");let c=id?client(id):{};document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${id?"Edit Customer":"New Customer"}</h2><div class="fields"><div class="field full"><label>Full Name *</label><input id="cn" value="${esc(c.name||"")}"></div><div class="field"><label>Phone *</label><input id="cp" value="${esc(c.phone||"")}"></div><div class="field"><label>NIDA / ID</label><input id="ci" value="${esc(c.idno||"")}"></div><div class="field"><label>Centre *</label>${centreSelect("ccentre",c.centreId||"")}</div><div class="field"><label>Group / Circle</label><select id="cc"><option value="">-- None --</option>${filteredCircles(c.centreId||"").map(x=>`<option value="${x.id}" ${c.circleId===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>Address</label><input id="ca" value="${esc(c.address||"")}"></div></div><button class="btn primary" onclick="saveClientForm('${id||""}')">Hifadhi</button></div></div>`;ccentre.onchange=()=>cc.innerHTML=`<option value="">-- None --</option>${filteredCircles(ccentre.value).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}`}
function saveClientForm(id){let old=id?client(id):{},c={id:id||uid(),name:cn.value.trim(),phone:cp.value.trim(),idno:ci.value.trim(),centreId:ccentre.value,circleId:cc.value,address:ca.value.trim(),dateJoined:old.dateJoined||today()};if(!c.name||!c.phone||!c.centreId)return alert("Jaza jina, simu na Centre");if(id)db.clients=db.clients.map(x=>x.id===id?c:x);else db.clients.push(c);log(id?"UPDATE":"CREATE","client",c.id,c.name);save();closeModal();render()}
function deleteClient(id){if(!can("admin","manager"))return alert("Huna ruhusa.");if(db.loans.some(x=>x.clientId===id))return alert("Mteja ana loan records; hawezi kufutwa.");if(confirm("Futa customer?")){db.clients=db.clients.filter(x=>x.id!==id);log("DELETE","client",id);save();render()}}
function clientHistory(id){let c=client(id),a=clientLoans(id);document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>${esc(c?.name||"")}</h2><p class="sub">${esc(c?.phone||"")} · Centre: <b>${esc(centreName(c?.centreId))}</b></p>${a.length?`<div class="tablewrap"><table class="table"><tr><th>Cycle</th><th>Amount</th><th>Repaid</th><th>Outstanding</th><th>Status</th></tr>${a.map(l=>`<tr><td>${cycleBadge(l.loanCycle)}</td><td>${money(l.principal)}</td><td>${money(l.repaid)}</td><td>${money(l.outstanding)}</td><td>${badge(l.status)}</td></tr>`).join("")}</table></div>`:'<div class="empty">Bado hajawahi kukopa.</div>'}</div></div>`}
function clientsPage(){let a=db.clients.filter(c=>(c.name+" "+c.phone+" "+(c.idno||"")).toLowerCase().includes(q.toLowerCase()));return header("Wateja","Customer register",can("admin","manager","loan_officer")?`<button class="btn primary" onclick="openClient()">+ Mteja</button>`:"")+`<div class="panel"><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Centre</th><th>Group</th><th>Loan Cycle</th><th>ID</th><th></th></tr>${a.map(c=>{let n=clientLoans(c.id).length;return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(centreName(c.centreId))}</td><td>${esc(circle(c.circleId)?.name||"-")}</td><td>${n?cycleBadge(n):"-"}</td><td>${esc(c.idno||"-")}</td><td><button class="btn ghost mini" onclick="clientHistory('${c.id}')">History</button> ${can("admin","manager","loan_officer")?`<button class="btn ghost mini" onclick="openClient('${c.id}')">Edit</button>`:""} ${can("admin","manager")?`<button class="btn danger mini" onclick="deleteClient('${c.id}')">Delete</button>`:""}</td></tr>`}).join("")}</table></div></div>`}
function openLoan(){if(!can("admin","manager","loan_officer"))return alert("Huna ruhusa ya kuanzisha loan.");if(!db.clients.length)return alert("Ongeza customer kwanza.");document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>New Loan</h2><div class="notice">Loan itaundwa kama Pending Approval. Manager/Admin ndiye ata-approve kabla ya disbursement.</div><div class="fields"><div class="field"><label>Customer *</label><select id="lc">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Circle</label><select id="lg"><option value="">-- Auto --</option>${db.circles.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Principal *</label><input id="lp" type="number" value="100000"></div><div class="field"><label>Interest %</label><input id="lr" type="number" value="10"></div><div class="field"><label>Interest Type</label><select id="lt"><option value="flat">Flat</option><option value="reducing">Reducing</option></select></div><div class="field"><label>Term Days *</label><input id="ld" type="number" value="30"></div><div class="field"><label>Disbursement Date</label><input id="ldate" type="date" value="${today()}"></div><div class="field"><label>Loan Fee</label><input id="lf" type="number" value="10000"></div><div class="field full"><label>Purpose / Notes</label><textarea id="ln"></textarea></div></div><button class="btn primary" onclick="saveLoanForm()">Submit for Approval</button></div></div>`}
function saveLoanForm(){let cid=lc.value,c=client(cid),l={id:uid(),loanNo:"BEVA-"+new Date().getFullYear()+"-"+Math.floor(100000+Math.random()*900000),clientId:cid,circleId:lg.value||c.circleId||"",principal:+lp.value,interestRate:+lr.value,interestType:lt.value,termDays:+ld.value,disbursementDate:ldate.value,fee:+lf.value||0,notes:ln.value,createdBy:session.id,createdByName:session.name,status:"Pending Approval"};if(!(l.principal>0)||!(l.termDays>0))return alert("Principal na term lazima");db.loans.push(l);db.approvals.push({id:uid(),type:"Loan",ref:l.loanNo,loanId:l.id,requestedBy:session.id,requestedByName:session.name,date:today(),status:"Pending"});log("CREATE_PENDING","loan",l.id,l.loanNo);save();closeModal();render()}
function decide(id,status){let a=db.approvals.find(x=>x.id===id);if(!a||a.status!=="Pending")return; a.status=status;a.decidedBy=session.id;a.decidedByName=session.name;a.decidedAt=new Date().toISOString();if(a.loanId){let l=db.loans.find(x=>x.id===a.loanId);if(l)l.status=status==="Approved"?"Hai":"Rejected"}log(status,"approval",id,a.ref);save();render()}
function openPayment(loanId=null,type="Daily"){let opts=loans().filter(l=>l.outstanding>0);if(!opts.length)return alert("Hakuna loan yenye outstanding");document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>Record Payment</h2><div class="field"><label>Loan</label><select id="pl" onchange="payInfo()">${opts.map(l=>`<option value="${l.id}" ${loanId===l.id?"selected":""}>${esc(client(l.clientId)?.name||"-")} · ${l.loanNo} · ${money(l.outstanding)}</option>`).join("")}</select></div><div id="pinfo" class="notice"></div><div class="fields"><div class="field"><label>Amount *</label><input id="pa" type="number"></div><div class="field"><label>Date</label><input id="pd" type="date" value="${today()}"></div><div class="field"><label>Type</label><select id="pt"><option ${type==="Daily"?"selected":""}>Daily</option><option ${type==="Prepayment"?"selected":""}>Prepayment</option><option>Full Settlement</option></select></div><div class="field"><label>Receipt / Ref</label><input id="pr"></div></div><button class="btn brandbtn" onclick="savePayment()">Hifadhi</button></div></div>`;payInfo();if(type==="Prepayment"){let l=loans().find(x=>x.id===loanId);if(l)pa.value=l.outstanding}}
function payInfo(){let l=loans().find(x=>x.id===pl.value);if(l)pinfo.innerHTML=`Outstanding <b>${money(l.outstanding)}</b> · Suggested daily <b>${money(Math.ceil(l.total/(l.termDays||30)))}</b>`}
function savePayment(){let l=loans().find(x=>x.id===pl.value),a=+pa.value;if(!l||!(a>0))return alert("Weka amount");if(a>l.outstanding)a=l.outstanding;let r={id:uid(),loanId:l.id,amount:a,date:pd.value,type:pt.value,ref:pr.value,userId:session.id,userName:session.name};db.repayments.push(r);db.cashbook.push({id:uid(),date:r.date,type:"IN",category:"Loan Repayment",amount:a,ref:r.ref||l.loanNo,userId:session.id,userName:session.name});log("REPAYMENT","loan",l.id,money(a)+" "+r.type);save();closeModal();render()}
function openCash(){if(!can("admin","manager","cashier"))return alert("Huna ruhusa");document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>Cash Transaction</h2><div class="fields"><div class="field"><label>Type</label><select id="ct"><option value="IN">IN</option><option value="OUT">OUT</option></select></div><div class="field"><label>Amount</label><input id="cam" type="number"></div><div class="field"><label>Category</label><input id="cat" placeholder="Expense / Deposit / Other"></div><div class="field"><label>Reference</label><input id="cr"></div></div><button class="btn primary" onclick="saveCash()">Hifadhi</button></div></div>`}
function saveCash(){let a=+cam.value;if(!(a>0))return alert("Amount");db.cashbook.push({id:uid(),date:today(),type:ct.value,amount:a,category:cat.value,ref:cr.value,userId:session.id,userName:session.name});log("CASH","cashbook","",ct.value+" "+money(a));save();closeModal();render()}
function voidLoan(id){if(!confirm("Void loan?"))return;let l=db.loans.find(x=>x.id===id);if(!l)return;l.status="Voided";log("VOID","loan",id,l.loanNo);save();closeModal();render()}
function saveSettings(){db.settings.company=document.getElementById("sc").value;db.settings.tagline=document.getElementById("st").value;log("UPDATE","settings","",db.settings.company);save();render()}
function dueToday(l){let x=schedule(l).find(s=>s.d===today());return x?x.due:0} function paidToday(l){return db.repayments.filter(r=>r.loanId===l.id&&r.date===today()).reduce((s,r)=>s+(+r.amount||0),0)}
function closeModal(){document.getElementById("modal").innerHTML=""}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="BEVA-V4-backup-"+today()+".json";a.click()}
function restoreData(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);normalize();log("RESTORE","database","","Backup restored");save();render()}catch(e){alert("Invalid backup")}};r.readAsText(f)}
load();
</script>
</body></html>
